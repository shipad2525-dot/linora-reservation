<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ご予約 | Linora nail &amp; care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF7F1;
    --surface: #FFFFFF;
    --surface-alt: #F3ECE1;
    --line: #E1D3B8;
    --ink: #382E24;
    --ink-soft: #8B7B65;
    --ink-faint: #C9BFA9;
    --gold: #A9843F;
    --gold-deep: #8C6C2E;
    --sage: #74836B;
    --danger: #A85B4C;
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    padding-bottom: 100px;
  }
  header.brand{
    padding: 36px 28px 22px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  header.brand .mark{
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 34px;
    color: var(--gold-deep);
    letter-spacing: 0.02em;
  }
  header.brand .sub{
    margin-top: 6px;
    font-family: "Shippori Mincho", serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--ink-soft);
  }
  .steps{
    display:flex;
    justify-content:center;
    gap: 5px;
    padding: 18px 20px 0;
  }
  .steps .dot{
    flex:1;
    max-width: 46px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    transition: background .25s ease;
  }
  .steps .dot.active{ background: var(--gold); }
  .steps .dot.done{ background: var(--gold-deep); }

  main{ padding: 24px 22px 0; }
  .panel{ display:none; }
  .panel.visible{ display:block; animation: fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  h2.step-title{
    font-family: "Shippori Mincho", serif;
    font-weight: 600;
    font-size: 20px;
    margin: 4px 0 4px;
  }
  p.step-desc{
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 18px;
  }
  .multi-note{
    color: var(--danger);
    font-size: 12px;
    margin-left: 4px;
    font-weight: 500;
  }

  /* ---- calendar ---- */
  .cal-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .cal-nav .month-label{
    font-family: "Shippori Mincho", serif;
    font-size: 16px;
  }
  .cal-nav button{
    border: 1px solid var(--line);
    background: var(--surface);
    width: 32px; height: 32px;
    font-size: 15px;
    color: var(--ink);
    cursor:pointer;
  }
  .cal-nav button:disabled{ opacity: .3; cursor:not-allowed; }
  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align:center;
  }
  .cal-grid .wd{
    font-size: 11px;
    color: var(--ink-soft);
    padding-bottom: 6px;
  }
  .cal-cell{
    position:relative;
    aspect-ratio: 1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size: 13px;
    border: 1px solid transparent;
    cursor:pointer;
    color: var(--ink);
  }
  .cal-cell.pad{ visibility:hidden; cursor:default; }
  .cal-cell .num{ font-size: 13px; }
  .cal-cell .dot-avail{
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--sage);
    margin-top: 3px;
  }
  .cal-cell.closed, .cal-cell.past{
    color: var(--ink-faint);
    cursor:not-allowed;
  }
  .cal-cell.full{
    color: var(--ink-faint);
    text-decoration: line-through;
    cursor:not-allowed;
  }
  .cal-cell.selected{
    background: var(--gold-deep);
    color: #fff;
    border-radius: 50%;
  }
  .cal-cell.selected .dot-avail{ background: #fff; }
  .cal-legend{
    display:flex; gap: 14px; margin-top: 14px; font-size: 11px; color: var(--ink-soft);
  }
  .cal-legend span{ display:flex; align-items:center; gap: 5px; }
  .cal-legend .sw{ width: 8px; height: 8px; border-radius: 50%; }
  .sw.avail{ background: var(--sage); }
  .sw.full{ background: var(--ink-faint); }

  .group-label{
    font-family: "Shippori Mincho", serif;
    font-size: 14px;
    color: var(--gold-deep);
    margin: 22px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .group-label:first-of-type{ margin-top: 0; }

  .menu-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px dotted var(--line);
  }
  .menu-row input[type=checkbox]{
    accent-color: var(--gold-deep);
    width: 18px; height: 18px; flex: none;
  }
  .menu-row .name-wrap{ flex:1; }
  .menu-row .name{ font-size: 15px; display:block; }
  .menu-row .note{ font-size: 11px; color: var(--ink-soft); display:block; margin-top: 2px; }
  .menu-row .price{ font-size: 14px; color: var(--ink-soft); white-space:nowrap; }
  .menu-row.checked{ background: var(--surface-alt); }
  .menu-row.disabled{ opacity: .55; }
  .menu-row.disabled .name{ text-decoration: line-through; }
  .menu-row.disabled .note{ color: var(--danger); text-decoration:none; }

  .qty-stepper{
    display:flex; align-items:center; gap: 8px;
    margin-left: 30px; margin-top: -6px; margin-bottom: 10px;
  }
  .qty-stepper button{
    width: 26px; height: 26px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 14px;
    cursor:pointer;
    color: var(--ink);
  }
  .qty-stepper .qty-val{ font-size: 13px; min-width: 42px; text-align:center; }

  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input, .field textarea{
    width: 100%;
    padding: 12px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
  }
  .field textarea{ resize: vertical; min-height: 70px; }
  .field input:focus, .field textarea:focus{ outline: none; border-color: var(--gold); }
  .field.required label::after{ content: " ※必須"; color: var(--danger); font-size: 11px; }

  .slot-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .slot-btn{
    padding: 10px 4px;
    text-align:center;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    font-size: 14px;
    cursor:pointer;
    color: var(--ink);
  }
  .slot-btn.selected{ background: var(--gold-deep); border-color: var(--gold-deep); color: #fff; }
  .slot-btn.disabled{ color: var(--ink-faint); text-decoration: line-through; cursor:not-allowed; background: #F5F0E6; }
  .slot-empty{ color: var(--ink-soft); font-size: 13px; padding: 14px 4px; }
  .selected-date-label{
    font-family: "Shippori Mincho", serif;
    color: var(--gold-deep);
    font-size: 15px;
    margin-bottom: 4px;
  }
  .duration-note{ font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }

  .summary-card{
    background: var(--surface-alt);
    border: 1px solid var(--line);
    padding: 16px;
    margin-bottom: 18px;
  }
  .summary-card .line{ display:flex; justify-content: space-between; font-size: 14px; padding: 5px 0; }
  .summary-card .line.total{
    border-top: 1px solid var(--line);
    margin-top: 6px; padding-top: 10px;
    font-family: "Shippori Mincho", serif;
    font-size: 16px; color: var(--gold-deep);
  }
  .summary-card .empty-note{ color: var(--ink-soft); font-size: 13px; }

  .nav-bar{
    position: sticky;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 18px 22px 22px;
    display:flex;
    gap: 10px;
  }
  .btn{
    flex:1;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-family: "Shippori Mincho", serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  .btn-primary{ background: var(--gold-deep); color: #fff; }
  .btn-primary:disabled{ background: #D8CBAE; color: #fff; cursor:not-allowed; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1px solid var(--line); flex: 0 0 90px; }

  .success{ text-align:center; padding: 60px 26px 40px; }
  .success .icon{
    width: 56px; height:56px; margin: 0 auto 20px;
    border: 1px solid var(--gold-deep);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family: "Cormorant Garamond", serif;
    font-size: 26px; color: var(--gold-deep);
  }
  .success h2{ font-family:"Shippori Mincho", serif; font-size: 21px; margin: 0 0 10px; }
  .success p{ color: var(--ink-soft); font-size: 14px; }
  .success .summary-card{ text-align:left; margin-top: 24px; }

  footer.note{
    text-align:center;
    color: var(--ink-soft);
    font-size: 11px;
    padding: 20px 30px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="mark">Linora</div>
    <div class="sub">nail &amp; care ご予約</div>
  </header>

  <div class="steps" id="stepsIndicator">
    <div class="dot" data-step="1"></div>
    <div class="dot" data-step="2"></div>
    <div class="dot" data-step="3"></div>
    <div class="dot" data-step="4"></div>
    <div class="dot" data-step="5"></div>
  </div>

  <main>
    <!-- STEP 1: 日付選択（カレンダー） -->
    <section class="panel" id="panel1">
      <h2 class="step-title">日付を選ぶ</h2>
      <p class="step-desc">緑の点がある日は空きあり／火曜定休です。</p>
      <div class="cal-nav">
        <button id="prevMonth" type="button">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button id="nextMonth" type="button">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><span class="sw avail"></span>空きあり</span>
        <span><span class="sw full"></span>満席／定休日</span>
      </div>
    </section>

    <!-- STEP 2: メニュー選択 -->
    <section class="panel" id="panel2">
      <h2 class="step-title">メニューを選ぶ</h2>
      <p class="step-desc">ご希望のメニューをお選びください。<span class="multi-note">※メニュー・オプションともに複数選択可</span></p>
      <div id="menuArea"></div>
      <div class="summary-card" id="menuSummary"></div>
    </section>

    <!-- STEP 3: 時間選択 -->
    <section class="panel" id="panel3">
      <h2 class="step-title">時間を選ぶ</h2>
      <div class="selected-date-label" id="selectedDateLabel"></div>
      <div class="duration-note" id="durationNote"></div>
      <div id="slotArea"></div>
    </section>

    <!-- STEP 4: お客様情報 -->
    <section class="panel" id="panel4">
      <h2 class="step-title">お客様情報</h2>
      <p class="step-desc">ご連絡先を入力してください。</p>
      <div class="field required">
        <label for="nameInput">お名前</label>
        <input type="text" id="nameInput" placeholder="山田 花子">
      </div>
      <div class="field required">
        <label for="telInput">電話番号</label>
        <input type="tel" id="telInput" placeholder="090-1234-5678">
      </div>
      <div class="field">
        <label for="lineInput">LINE名（分かる場合）</label>
        <input type="text" id="lineInput" placeholder="LINEの表示名">
      </div>
      <div class="field">
        <label for="noteInput">ご要望・備考</label>
        <textarea id="noteInput" placeholder="デザインのご希望や、初回かどうかなど"></textarea>
      </div>
    </section>

    <!-- STEP 5: 確認 -->
    <section class="panel" id="panel5">
      <h2 class="step-title">予約内容の確認</h2>
      <p class="step-desc">内容をご確認の上、送信してください。</p>
      <div class="summary-card" id="confirmSummary"></div>
    </section>

    <!-- 完了画面 -->
    <section class="panel" id="panelDone">
      <div class="success">
        <div class="icon">✓</div>
        <h2>ご予約を受け付けました</h2>
        <p>サロンからの確定連絡をお待ちください。</p>
        <div class="summary-card" id="doneSummary"></div>
      </div>
    </section>
  </main>

  <div class="nav-bar" id="navBar">
    <button class="btn btn-ghost" id="btnBack">戻る</button>
    <button class="btn btn-primary" id="btnNext">次へ</button>
  </div>

  <footer class="note">Linora nail &amp; care ・ 都城市チャレンジショップ</footer>
</div>

<script src="shared.js"></script>
<script>
(function(){
  let step = 1;
  const totalSteps = 5;
  const state = {
    date: null,          // "YYYY-MM-DD"
    time: null,
    menuItemIds: new Set(),
    optionIds: new Set(),
    optionQty: {},        // id -> qty
    name: "", tel: "", line: "", note: "",
  };

  const panels = { 1: panel1, 2: panel2, 3: panel3, 4: panel4, 5: panel5 };
  const dots = document.querySelectorAll(".steps .dot");
  const navBar = document.getElementById("navBar");
  const btnBack = document.getElementById("btnBack");
  const btnNext = document.getElementById("btnNext");
  const hours = loadHours();

  // ---------- STEP 1: カレンダー ----------
  let calYear, calMonth; // calMonth: 0-11
  const today = new Date();
  today.setHours(0,0,0,0);

  function initCalendar(){
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    renderCalendar();
  }

  function renderCalendar(){
    const first = new Date(calYear, calMonth, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    document.getElementById("monthLabel").textContent = `${calYear}年 ${calMonth + 1}月`;

    const prevBtn = document.getElementById("prevMonth");
    const isCurrentMonth = (calYear === today.getFullYear() && calMonth === today.getMonth());
    prevBtn.disabled = isCurrentMonth;

    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    ["日","月","火","水","木","金","土"].forEach(w => {
      const wd = document.createElement("div");
      wd.className = "wd";
      wd.textContent = w;
      grid.appendChild(wd);
    });
    for (let i = 0; i < startWeekday; i++) {
      const pad = document.createElement("div");
      pad.className = "cal-cell pad";
      grid.appendChild(pad);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(calYear, calMonth, d);
      const key = dateKey(dateObj);
      const cell = document.createElement("div");
      cell.className = "cal-cell";
      const isPast = dateObj < today;
      const isClosed = hours.closedWeekdays.includes(dateObj.getDay());
      const numEl = document.createElement("div");
      numEl.className = "num";
      numEl.textContent = d;
      cell.appendChild(numEl);

      if (isPast) {
        cell.classList.add("past");
      } else if (isClosed) {
        cell.classList.add("closed");
      } else {
        const hasOpening = dayHasAnyOpening(dateObj, hours);
        if (!hasOpening) {
          cell.classList.add("full");
        } else {
          const dot = document.createElement("div");
          dot.className = "dot-avail";
          cell.appendChild(dot);
          cell.addEventListener("click", () => {
            state.date = key;
            state.time = null;
            document.querySelectorAll(".cal-cell.selected").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            validateStep();
          });
        }
      }
      if (state.date === key) cell.classList.add("selected");
      grid.appendChild(cell);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    calMonth -= 1;
    if (calMonth < 0) { calMonth = 11; calYear -= 1; }
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    calMonth += 1;
    if (calMonth > 11) { calMonth = 0; calYear += 1; }
    renderCalendar();
  });

  // ---------- STEP 2: メニュー ----------
  function renderMenu(){
    const area = document.getElementById("menuArea");
    area.innerHTML = "";
    [LINORU_MENU.care, LINORU_MENU.gel, LINORU_MENU.off].forEach(group => {
      const label = document.createElement("div");
      label.className = "group-label";
      label.textContent = group.label;
      area.appendChild(label);
      group.items.forEach(item => area.appendChild(buildMenuRow(item)));
    });
    const optLabel = document.createElement("div");
    optLabel.className = "group-label";
    optLabel.textContent = "OPTION（複数選択可・本数指定）";
    area.appendChild(optLabel);
    LINORU_OPTIONS.forEach(item => area.appendChild(buildOptionRow(item)));
    updateMenuSummary();
  }

  function priceLabel(item){
    return (item.priceUpTo ? "〜" : "") + yen(item.price);
  }

  function buildMenuRow(item){
    const row = document.createElement("label");
    row.className = "menu-row" + (item.disabled ? " disabled" : "");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.disabled = !!item.disabled;
    input.addEventListener("change", () => {
      if (input.checked) state.menuItemIds.add(item.id); else state.menuItemIds.delete(item.id);
      row.classList.toggle("checked", input.checked);
      updateMenuSummary();
      validateStep();
    });
    const nameWrap = document.createElement("div");
    nameWrap.className = "name-wrap";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    nameWrap.appendChild(name);
    if (item.disabled && item.disabledNote) {
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = "※ " + item.disabledNote;
      nameWrap.appendChild(note);
    } else if (item.note) {
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = "（" + item.note + "）";
      nameWrap.appendChild(note);
    }
    const price = document.createElement("span");
    price.className = "price";
    price.textContent = priceLabel(item);
    row.appendChild(input);
    row.appendChild(nameWrap);
    row.appendChild(price);
    return row;
  }

  function buildOptionRow(item){
    const wrap = document.createElement("div");
    state.optionQty[item.id] = state.optionQty[item.id] || 1;

    const row = document.createElement("label");
    row.className = "menu-row";
    const input = document.createElement("input");
    input.type = "checkbox";
    const nameWrap = document.createElement("div");
    nameWrap.className = "name-wrap";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    nameWrap.appendChild(name);
    const price = document.createElement("span");
    price.className = "price";
    price.textContent = yen(item.price) + " /本";
    row.appendChild(input);
    row.appendChild(nameWrap);
    row.appendChild(price);

    const stepper = document.createElement("div");
    stepper.className = "qty-stepper";
    stepper.style.display = "none";
    const minus = document.createElement("button");
    minus.type = "button"; minus.textContent = "－";
    const qtyVal = document.createElement("span");
    qtyVal.className = "qty-val";
    qtyVal.textContent = "本数：" + state.optionQty[item.id];
    const plus = document.createElement("button");
    plus.type = "button"; plus.textContent = "＋";
    stepper.appendChild(minus);
    stepper.appendChild(qtyVal);
    stepper.appendChild(plus);

    function refreshQty(){
      qtyVal.textContent = "本数：" + state.optionQty[item.id];
    }
    minus.addEventListener("click", () => {
      state.optionQty[item.id] = Math.max(1, state.optionQty[item.id] - 1);
      refreshQty();
      updateMenuSummary();
    });
    plus.addEventListener("click", () => {
      state.optionQty[item.id] = Math.min(10, state.optionQty[item.id] + 1);
      refreshQty();
      updateMenuSummary();
    });

    input.addEventListener("change", () => {
      if (input.checked) state.optionIds.add(item.id); else state.optionIds.delete(item.id);
      row.classList.toggle("checked", input.checked);
      stepper.style.display = input.checked ? "flex" : "none";
      updateMenuSummary();
      validateStep();
    });

    wrap.appendChild(row);
    wrap.appendChild(stepper);
    return wrap;
  }

  function selectedMenuItems(){
    const all = [LINORU_MENU.care, LINORU_MENU.gel, LINORU_MENU.off].flatMap(g => g.items);
    return all.filter(i => state.menuItemIds.has(i.id));
  }
  function selectedOptions(){
    return LINORU_OPTIONS.filter(o => state.optionIds.has(o.id));
  }
  function estimateTotal(){
    let total = 0;
    selectedMenuItems().forEach(m => total += m.price);
    selectedOptions().forEach(o => total += o.price * (state.optionQty[o.id] || 1));
    return total;
  }
  function estimateDuration(){
    let dur = selectedMenuItems().reduce((sum, m) => sum + m.duration, 0);
    selectedOptions().forEach(o => dur += (o.perNailDuration || 0) * (state.optionQty[o.id] || 1));
    return dur || 30;
  }
  function updateMenuSummary(){
    const box = document.getElementById("menuSummary");
    const items = selectedMenuItems();
    if (items.length === 0) {
      box.innerHTML = '<div class="empty-note">メニューを選択してください</div>';
      return;
    }
    let html = "";
    items.forEach(m => html += `<div class="line"><span>${m.name}</span><span>${priceLabel(m)}</span></div>`);
    selectedOptions().forEach(o => {
      const qty = state.optionQty[o.id] || 1;
      html += `<div class="line"><span>＋ ${o.name} × ${qty}本</span><span>${yen(o.price * qty)}</span></div>`;
    });
    html += `<div class="line total"><span>目安合計</span><span>${yen(estimateTotal())}〜</span></div>`;
    box.innerHTML = html;
  }

  // ---------- STEP 3: 時間選択 ----------
  function renderSlots(){
    const area = document.getElementById("slotArea");
    document.getElementById("selectedDateLabel").textContent = state.date ? state.date + " のご予約" : "";
    const dur = estimateDuration();
    document.getElementById("durationNote").textContent = `所要時間の目安：約${dur}分`;
    if (!state.date) { area.innerHTML = ""; return; }
    const dateObj = new Date(state.date + "T00:00:00");
    const slots = availableSlotsForDate(dateObj, dur, hours);
    if (slots.length === 0) {
      area.innerHTML = '<div class="slot-empty">選択した日は定休日です。前の画面で別の日をお選びください。</div>';
      return;
    }
    const grid = document.createElement("div");
    grid.className = "slot-grid";
    slots.forEach(s => {
      const btn = document.createElement("div");
      btn.className = "slot-btn" + (!s.available ? " disabled" : "") + (state.time === s.time ? " selected" : "");
      btn.textContent = s.time;
      if (s.available) {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          state.time = s.time;
          validateStep();
        });
      }
      grid.appendChild(btn);
    });
    area.innerHTML = "";
    area.appendChild(grid);
  }

  // ---------- STEP 4: お客様情報 ----------
  ["nameInput","telInput","lineInput","noteInput"].forEach(id => {
    document.getElementById(id).addEventListener("input", (e) => {
      const key = id.replace("Input","");
      state[key] = e.target.value;
      validateStep();
    });
  });

  // ---------- STEP 5: 確認 ----------
  function renderConfirm(){
    const items = selectedMenuItems();
    const opts = selectedOptions();
    let html = `<div class="line"><span>メニュー</span><span>${items.map(m=>m.name).join("、")}</span></div>`;
    if (opts.length) {
      const optText = opts.map(o => `${o.name}×${state.optionQty[o.id] || 1}本`).join("、");
      html += `<div class="line"><span>オプション</span><span>${optText}</span></div>`;
    }
    html += `<div class="line"><span>日時</span><span>${state.date} ${state.time}</span></div>`;
    html += `<div class="line"><span>お名前</span><span>${state.name} 様</span></div>`;
    html += `<div class="line"><span>電話番号</span><span>${state.tel}</span></div>`;
    if (state.line) html += `<div class="line"><span>LINE名</span><span>${state.line}</span></div>`;
    if (state.note) html += `<div class="line"><span>備考</span><span>${state.note}</span></div>`;
    html += `<div class="line total"><span>お会計目安</span><span>${yen(estimateTotal())}〜</span></div>`;
    document.getElementById("confirmSummary").innerHTML = html;
  }

  // ---------- ナビゲーション ----------
  function validateStep(){
    let ok = true;
    if (step === 1) ok = !!state.date;
    if (step === 2) ok = state.menuItemIds.size > 0;
    if (step === 3) ok = !!state.time;
    if (step === 4) ok = !!(state.name.trim() && state.tel.trim());
    btnNext.disabled = !ok;
    return ok;
  }

  function goToStep(n){
    step = n;
    Object.values(panels).forEach(p => p.classList.remove("visible"));
    document.getElementById("panelDone").classList.remove("visible");
    if (step <= totalSteps) panels[step].classList.add("visible");
    dots.forEach(d => {
      const s = parseInt(d.dataset.step, 10);
      d.classList.toggle("active", s === step);
      d.classList.toggle("done", s < step);
    });
    btnBack.style.visibility = step === 1 ? "hidden" : "visible";
    btnNext.textContent = step === totalSteps ? "予約を送信する" : "次へ";
    if (step === 3) renderSlots();
    if (step === 5) renderConfirm();
    validateStep();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  btnBack.addEventListener("click", () => { if (step > 1) goToStep(step - 1); });

  btnNext.addEventListener("click", () => {
    if (!validateStep()) return;
    if (step < totalSteps) { goToStep(step + 1); return; }

    const items = selectedMenuItems();
    const opts = selectedOptions();
    const booking = addBooking({
      menuIds: items.map(m => m.id),
      menuName: items.map(m => m.name).join("、"),
      optionIds: Array.from(state.optionIds),
      optionNames: opts.map(o => `${o.name}×${state.optionQty[o.id] || 1}本`),
      durationMinutes: estimateDuration(),
      date: state.date,
      time: state.time,
      name: state.name.trim(),
      tel: state.tel.trim(),
      line: state.line.trim(),
      note: state.note.trim(),
      total: estimateTotal(),
    });
    document.getElementById("doneSummary").innerHTML =
      `<div class="line"><span>メニュー</span><span>${booking.menuName}</span></div>` +
      `<div class="line"><span>日時</span><span>${booking.date} ${booking.time}</span></div>` +
      `<div class="line"><span>お名前</span><span>${booking.name} 様</span></div>` +
      `<div class="line total"><span>お会計目安</span><span>${yen(booking.total)}〜</span></div>`;
    Object.values(panels).forEach(p => p.classList.remove("visible"));
    document.getElementById("panelDone").classList.add("visible");
    navBar.style.display = "none";
    dots.forEach(d => d.classList.add("done"));
    window.scrollTo({top:0, behavior:"smooth"});
  });

  // init
  initCalendar();
  renderMenu();
  goToStep(1);
})();
</script>
</body>
</html>
